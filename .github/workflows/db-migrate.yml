name: Database Migrations (Prisma)

on:
  workflow_dispatch:
    inputs:
      resolve_rolled_back:
        description: 'Migration name to mark as rolled-back before deploying (recovery from a failed migration, e.g. after fixing its SQL). Leave empty for a normal run.'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'packages/prisma/prisma/migrations/**'
      - 'packages/prisma/prisma/schema.prisma'

permissions:
  contents: read

concurrency:
  group: db-migrate-main
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Use session-mode pooler (port 5432) which supports advisory locks.
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Resolve rolled-back migration (manual recovery only)
        if: ${{ github.event.inputs.resolve_rolled_back != '' }}
        run: pnpm exec prisma migrate resolve --rolled-back "${{ github.event.inputs.resolve_rolled_back }}" --schema packages/prisma/prisma/schema.prisma

      - name: Apply migrations
        run: pnpm db:migrate:deploy
